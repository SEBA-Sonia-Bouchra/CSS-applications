<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elzero Web School Example</title>
        <style>
            *{
                box-sizing: border-box;
            }
            :root{
                --backgroundColor:orangered;
                --textColor: white;
            }
            h1{
                position: relative;
                width: 150px;
                height: 80px;
                margin: 50px auto;
                font-size: xx-large;
                font-weight: bold;
                color: var(--textColor);
                display: grid;
                justify-content: center;
                align-items: center;
                background-color: var(--backgroundColor);
            }
            h1::before{
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                background-color: var(--backgroundColor);
                width: 100%;
                height: 100%;
                z-index: -1;
                transform: skewX(10deg) skewY(10deg);
            }
            h1::after{
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                background-color: var(--backgroundColor);
                width: 100%;
                height: 100%;
                z-index: -1;
                transform: skewX(-10deg) skewY(-10deg);
            }
        </style>
    </head>
    <body>
        <h1>Elzero</h1>
    </body>
</html>
