<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elzero Web School Example</title>
        <style>
            *{
                box-sizing: border-box;
            }
            :root{
                --backgroundColor:rgb(27, 122, 230);
                --backgroundColor2:rgb(255, 0, 0);
                --textColor: white;
                --dimention: 200px;
            }
            .container{
                margin: 40px auto;
                width: var(--dimention);
                perspective: 800px;
            }
            .box{
                position: relative;
                width: var(--dimention);
                height: var(--dimention);
                transform-style: preserve-3d;
                transition: transform 1s;
            }
            .box .face{
                position: absolute;
                width: var(--dimention);
                height: var(--dimention);
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: Arial, Helvetica, sans-serif;
                font-weight: bold ;
                font-size: 30px ;
                color: var(--textColor);
                backface-visibility: hidden;
            }
            .box .front{
                background-color: red;
            }
            .box .back{
                background-color: rgb(0, 140, 255);
                transform: rotateX(180deg); /* or rotateY() */
            }
            .box:hover{
                transform: rotateX(-180deg); /* or rotateY() */
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="box">
                <div class="face front">Front</div>
                <div class="face back">Back</div>
            </div>
        </div>
    </body>
</html>
