<!DOCTYPE html>
<html>
    <head>
        <style>
            span{
                width: 50px;
                height: 50px;
                position: absolute;
                top: 50%;
                left: 50%;
                margin-top: -50px;
                margin-left: -50px;
                border-radius: 50%;
                border: rgb(0, 0, 0) 7px solid;
                border-right-color: transparent;
                animation-name: spin;
                animation-duration: 1.5s;
                animation-iteration-count: infinite;
                animation-timing-function: ease-in;
                animation-direction: reverse;
            }
            @keyframes spin{
                100%{
                    transform: rotate(720deg);
                }
            }
        </style>
    </head>
    <body>
        <span></span>
    </body>
</html>
