<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elzero Web School Example</title>
        <style>
            *{
                box-sizing: border-box;
            }
            div{
                width: 200px;
                height: 200px;
                border-radius: 50%;
                background-color: #eee;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%,-50%);
                display: grid;
                justify-content: center;
                align-items: center;
                font-size:30px;
                font-weight: bold;
                border: 10px solid;
                border-color:red red red white;
            }
            div:hover{
                transform: rotate(180deg);
                transition: 0.5s;
            }
        </style>
    </head>
    <body>
        <div>Elzero</div>
    </body>
</html>
