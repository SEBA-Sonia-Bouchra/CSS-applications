<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elzero Web School Example</title>
        <style>
            div{
                text-align: center;
                -webkit-box-sizing: border-box;
                -moz-box-sizing: border-box;
            }
            .parent{
                background-color: #eee;
                padding: 10px;
                width: 400px;
                height:150px;
                transition: margin-top 0.5s 0s;
                margin: 20px auto;
                position: relative;
            }
            .child{
                background-color: #cecece;
                padding: 10px;
                width: 350px;
                margin: 10px auto;
                transition: margin-top 0s 0.5s linear;
            }
            .parent:hover{
                margin-top: 5px;
            }
            .parent:hover .child{
                margin-top: 30px;
            }
        </style>
    </head>
    <body>
        <div class="parent">
            will go up on hover in half second
            <div class="child">
                will go down after half second
            </div>
        </div>
    </body>
</html>
