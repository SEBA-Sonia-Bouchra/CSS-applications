<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elzero Web School Example</title>
        <style>
            div{
                background-color: #eee !important;
                color: transparent !important;
                text-align: center;
                font-size: 20px !important;
                width: 400px;
                margin: auto;
                border: none !important;
                position: relative;
            }
            div::before{
                font-family: Arial, Helvetica, sans-serif;
                content: "ELZERO";
                color: black;
                font-weight: bold;
                position: absolute;
                left: 170px;
            }
        </style>
    </head>
    <body>
        <div style="
            background-color: red;
            color: white;
            padding: 20px;
            border: 1px solid blue;
            font-size: 80px;">
            Hello Div
        </div>
    </body>
</html>
