<!DOCTYPE html>
<html>
    <head>
        <style>
            div{
                width: 100px;
                height: 100px;
                margin-left: 20px;
                position: relative;
            }
            .green{
                background-color: green;
                top: 10px;
                z-index: 3;
            }
            .red{
                background-color: red;
                bottom: 80px;
                left: 10px;
                z-index: 4;
            }
            .blue{
                margin-top: 20px;
                background-color: blue;
                top: -220px;
                left: -10px;
                z-index: 2;
            }
            .black{
                background-color: black;
                top: -310px;
                left: -10px;
            }
            </style>
    </head>
    <body>
        <div class="green"></div>
        <div class="red"></div>
        <div class="blue"></div>
        <div class="black"></div>
    </body>
</html>
