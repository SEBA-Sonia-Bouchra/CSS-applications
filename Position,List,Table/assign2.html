<!DOCTYPE html>
<html>
    <head>
        <style>
            div{
                width: 400px;
                margin: auto;
                margin-top: 20px;
                background-color: #eee;
                padding: 20px;
                border: solid 2px ;
                border-color: rgb(255, 38, 38) rgb(0, 174, 255);
                font-family: Arial, Helvetica, sans-serif;
            }
            .top-left,
            .bottom-left,
            .top-right,
            .bottom-right{
                width: 20px;
                background-color: rgb(0, 174, 255);
                color: aliceblue;
                position: absolute;
                text-align: center;
            }
            .top-left{
                border-right: solid 2px rgb(255, 38, 38) ;
                top: 12px;
                left: 88px;
            }
            .bottom-left{
                border-right: solid 2px rgb(255, 38, 38) ;
                top: 125px;
                left: 88px;
            }
            .top-right{
                border-right: solid 2px rgb(255, 38, 38) ;
                top: 12px;
                left: 530px;
            }
            .bottom-right{
                border-right: solid 2px rgb(255, 38, 38) ;
                top: 125px;
                left: 530px;
            }
            </style>
    </head>
    <body>
        <div>
            Lorem, ipsum dolor sit amet consectetur adipisicing elit. Quod, sed. Ea ipsum
            similique quasi rem, fugiat voluptatibus reiciendis nam debitis earum quo veniam
            laudantium mollitia atque! Laborum ea nam doloribus.
            <span class="top-left">1</span>
            <span class="bottom-left">2</span>
            <span class="top-right">3</span>
            <span class="bottom-right">4</span>
          </div>
    </body>
</html>
