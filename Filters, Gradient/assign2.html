<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elzero Web School Example</title>
        <style>
            *{
                box-sizing: border-box;
            }
            div{
                position: relative;
                width: 600px;
                margin: 20px auto;
            }
            input{
                width: inherit;
                background-color: #eee;
                padding: 20px;
                border: none;
                display: block;
                caret-color: red;
            }
            div::before{
                content: "";
                position: absolute;
                width: 600px;
                height: 3px;
                top: 55px;
                left: 0;
                background: linear-gradient(
                    to right,
                    rgb(255, 57, 57) 50%,
                    rgb(0, 189, 0) 50%
                );
            }
            input:focus{
                outline: none;
            }
        </style>
    </head>
    <body>
        <div>
            <input type="text" placeholder="One">
        </div>
        <div>
            <input type="text" placeholder="Two">
        </div>
        <div>
            <input type="text" placeholder="Three">
        </div>
    </body>
</html>
