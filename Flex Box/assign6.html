<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elzero Web School Example</title>
        <style>
            *{
                box-sizing: border-box;
            }
            :root {
                --mainPadding: 10px;
                --mainWidth:1000px;
            }
            .page{
                width:var(--mainWidth);
                background-color: #eee;
                font-family: Arial, Helvetica, sans-serif;
                display: flex;
                padding: var(--mainPadding);
                flex-wrap: wrap;
                margin: auto;
            }
            .header{
                margin-bottom: 10px;
                width: 100%;
                display: flex;
                flex-direction: row;
                justify-content: space-between;
            }
            .footer{
                width: 100%;
                display: flex;
                flex-direction: row;
                align-items: center;
            }
            .main-area{
                width: 100%;
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                margin-bottom: 10px;
            }
            .links,
            .page div div{
                padding: var(--mainPadding);
                background-color: #dbdada;
                display: flex;
            }
            .logo{
                width: 10%;
                justify-content: center;
                align-items: center;
            }
            .links{
                list-style: none;
                width: 89%;
                align-items: center;
                justify-content: flex-end;
                margin: 0;
            }
            .content{
                width: 69%;
                height: 400px;
            }
            .sidebar{
                width: 30%;
                height: 400px;
            }
            .copyright{
                width: 50%;
            }
            .design{
                width: 50%;
                justify-content: flex-end;
            }
            li{
                margin-left: var(--mainPadding);
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="header">
              <div class="logo">Logo</div>
              <ul class="links">
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Contact</li>
              </ul>
            </div>
            <div class="main-area">
              <div class="content">Content</div>
              <div class="sidebar">Sidebar</div>
            </div>
            <div class="footer">
              <div class="copyright">Copyright 2021</div>
              <div class="design">Designed By Elzero</div>
            </div>
        </div>
    </body>
</html>
