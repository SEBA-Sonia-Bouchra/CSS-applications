<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elzero Web School Example</title>
        <style>
            *{
                box-sizing: border-box;
            }
            .parent{
                width: 600px;
                height: 300px;
                margin: auto;
                background-color: #eee;
                padding: 10px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }
            .parent div{
                color: white;
                background-color: rgb(0, 148, 156);
                height: calc(280px / 3);
                display: flex;
                padding: 10px;
                justify-content: center;
                align-items: center;
            }
            .one{
                align-self: flex-end;
            }
            .two{
                width: 45%;
            }
            .three{
                align-self: flex-end;
            }
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="one">1</div>
            <div class="two">2</div>
            <div class="three">3</div>
        </div>   
    </body>
</html>
