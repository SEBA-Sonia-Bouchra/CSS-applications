<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elzero Web School Example</title>
        <style>
            *{
                box-sizing: border-box;
            }
            .parent{
                width: 600px;
                height: 300px;
                margin: auto;
                background-color: #eee;
                padding: 10px;
                display: flex;
                flex-flow: row wrap;
                justify-content: space-between;
                align-items: flex-start;
                align-content: space-between;
            }
            .parent div{
                background-color: orangered;
                color: white;
                text-align: center;
                width: 32%;
                padding: 5px;
            }
        </style>
    </head>
    <body>
        <div class="parent">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
        </div>    
    </body>
</html>
