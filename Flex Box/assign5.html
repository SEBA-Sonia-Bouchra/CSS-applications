<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elzero Web School Example</title>
        <style>
            *{
                box-sizing: border-box;
            }
            .parent{
                width: 600px;
                height: 300px;
                margin: auto;
                background-color: #eee;
                padding: 10px;
                display: flex;
                justify-content: space-between;
                color: white;
            }
            .parent div{
                width: calc(380px/4);
                height: calc(280px/2);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .one{
                background-color: orange;
                order: 2;
                align-self: flex-start;
            }
            .two{
                background-color: rgb(101, 160, 13);
                order: 3;
                align-self: flex-end;
            }
            .three{
                background-color: rgb(101, 28, 28);
                order: 4;
                align-self: self-start;
            }
            .four{
                background-color: rgb(69, 0, 134);
                order: 1;
                align-self: self-end;
            }
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="one">1</div>
            <div class="two">2</div>
            <div class="three">3</div>
            <div class="four">4</div>
        </div> 
    </body>
</html>
