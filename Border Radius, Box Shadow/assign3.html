<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elzero Web School Example</title>
        <style>
            .parent{
                width: 550px;
                font-family: Arial, Helvetica, sans-serif;
                overflow: hidden;
            }
            .box1,
            .box2{
                float: left;
                background-color: #eee;
                margin-left: 40px;
                padding: 20px;
                text-align: center;

            }
            .box1{
                position: relative;
            }
            .price{
                background-color: #dbdbdb;
                height: 55px;
                width: 80px;
                border-radius: 50%;
                padding: 55px 30px 30px;
                font-size: larger;
            }
            .sub{
                background-color: rgb(12, 162, 231);
                border-radius: 5px;
                padding: 5px;
                color: white;
                font-weight: bold;
                margin-bottom: 30px;
            }
            .box1::after{
                content: "";
                background-color: rgb(12, 162, 231);
                height: 240px;
                width: 1px;
                position: absolute;
                top: 0;
                left: 199px;
                z-index: 20;
            }
            span{
                background-color: rgb(12, 162, 231);
                color: white;
                border-radius: 50%;
                height: 12px;
                width: 12px;
                padding: 5px;
                font-size: x-small;
                font-weight: bold;
                position: absolute;
                left: 188.5px;
                top: 110px;
                z-index: 40;
            }
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="box1">
                <div class="sub">Basic</div>
                <div class="price">
                    Free
                </div>
                <span>Or</span>
            </div>
            <div class="box2">
                <div class="sub">Pro</div>
                <div class="price">
                    $30
                </div>
            </div>
        </div>
    </body>
</html>
