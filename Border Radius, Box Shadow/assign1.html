<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elzero Web School Example</title>
        <style>
            div{
                float: left;
                background-color: #eee;
                width: 100px;
                height: 100px;
                border-radius: 50px;
                text-align: center;
                position: relative;
                margin-left: 20px;
                border: solid 2px black;
                counter-increment: numbers-counter;
                font-family: Arial, Helvetica, sans-serif;
                box-shadow: 
                -5px -5px 0 0 rgb(212, 0, 0) ,
                5px 5px 0 0 rgb(68, 137, 255) ;
            }
            p{
                position: absolute;
                top: 23%;
                left: 20%;
            }
            div::before{
                content: counter(numbers-counter);
                position: absolute;
                width: 20px;
                padding-top: 1px;
                padding-bottom: 1px;
                color: white;
                top: -8px;
                left: 40px;
                background-color: black;
                border-radius: 50%;
            }
        </style>
    </head>
    <body>
        <div>
            <p>Element</p>
        </div>
        <div>
            <p>Element</p>
        </div>        
        <div>
            <p>Element</p>
        </div>    
    </body>
</html>
