<!DOCTYPE html>
<html>
    <head>
        <style>
            *{
                box-sizing: border-box;
                margin: 0;
            }
            /* first method */
            div.parent > div + .child {       
                color: red;
            }
            /* second method */
            div.child:nth-child(2) {
                color: red;
            }
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="child">Testing</div>
            <div class="child">Code</div>
        </div>
        <div class="parent">
            <div>
              <div class="child">Testing</div>
            </div>
        </div>
        <div class="child">Testing</div>
    </body>
</html>
