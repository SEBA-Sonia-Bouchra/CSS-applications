<!DOCTYPE html>
<html>
    <head>
        <style>
            *{
                box-sizing: border-box;
                margin: 0;
            }
            div :not(h3):not(:first-child):not(:last-child){
                color: red;
            }
        </style>
    </head>
    <body>
        <div>
            <div>Testing</div>
            <div>Code</div>
            <div>Code</div>
            <h3>Testing</h3>
            <p>Code</p>
            <h3>Testing</h3>
            <div>Testing</div>
          </div>
    </body>
</html>
