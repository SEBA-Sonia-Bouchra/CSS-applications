                color: red;
            }
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="baby">Testing</div>
            <div class="baby">Testing</div>
        </div>
        <div class="parent">
            <div class="baby">Code</div>
        </div>

            <div>
                <div>Testing</div>
            </div>
            <div class="baby">Testing</div>
        </div>
        <div class="baby">Testing</div>
    </body>
</html>
