<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elzero Web School Example</title>
        <style>
            *{
                box-sizing: border-box;
                padding: 0;
                margin: 0;
            }
            .grid {
                background-color: #ddd;
                padding: 20px;
                width: 800px;
                height: 400px;
                margin: auto;
                display: grid;
                grid-template-columns: auto repeat(2,1fr) auto;
                grid-template-rows: 1fr auto;
                grid-gap: 20px;
            }
            div{
                display: grid;
                background-color: #312f2f;
                color: white;
                font-family: Arial, Helvetica, sans-serif;
                font-weight: bold;
                align-content: center;
                justify-content: center;
            }
        </style>
    </head>
    <body>
        <div class="grid">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
        </div>
    </body>
</html>
