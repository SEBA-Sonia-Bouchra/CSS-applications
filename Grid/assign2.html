<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elzero Web School Example</title>
        <style>
            *{
                box-sizing: border-box;
                padding: 0;
                margin: 0;
            }
            .layout{
                height: 100vh;
                background-color: #eee;
                color: white;
                display: grid;
                grid-template-columns: repeat(8,1fr);
                grid-template-rows: 7% 86% 7%;
                grid-template-areas: "header header header header header header header header "
                                      "section section section section section section aside aside"
                                      "footer footer footer footer footer footer footer footer";
            }
            header{
                grid-area: header;
                background-color: rgb(33, 118, 255);
                padding: 10px;
            }
            section{
                grid-area: section;
                background-color: orangered;
                padding: 10px;
            }
            aside{
                grid-area: aside;
                background-color: grey;
                padding: 10px;
            }
            footer{
                grid-area: footer;
                background-color: rgb(0, 147, 0);
                padding: 10px;
            }
            header::before{
                content: "Header";
            }
            section::before{
                content: "Section";
            }
            aside::before{
                content: "Aside";
            }
            footer::before{
                content: "Footer";
            }
        </style>
    </head>
    <body>
        <div class="layout">
            <header></header>
            <section></section>
            <aside></aside>
            <footer></footer>
        </div>
    </body>
</html>
