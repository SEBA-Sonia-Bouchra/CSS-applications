<!DOCTYPE html>
<html>
    <head>
        <style>
            div{
                width: 400px;
                height: 400px;
                background-image:url('css-assignment-5-8.png') ;
                background-color: antiquewhite;
            }
            .assign-4-shape-1{
                background-repeat: no-repeat;
                background-size: 80% ;
                background-position:  top left;
            }
            .assign-4-shape-2{
                background-repeat: repeat-y;
                background-size: 80% ;
                background-position: right;
            }
            .assign-4-shape-3{
                background-repeat: repeat-x;
                background-size: 80% ;
                background-position: bottom;
            }
            .assign-4-shape-4{
                background-repeat: no-repeat;
                background-size: 50%;
                background-position: bottom right;
            }
            </style>
    </head>
    <body>
        <div class="assign-4-shape-1">Normal Div</div><br>
        <div class="assign-4-shape-2">Normal Div</div><br>
        <div class="assign-4-shape-3">Normal Div</div><br>
        <div class="assign-4-shape-4">Normal Div</div><br>
    </body>
</html>
