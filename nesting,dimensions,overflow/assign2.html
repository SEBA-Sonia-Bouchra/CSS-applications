<html>

                color: white;
                font-family: Arial, Helvetica, sans-serif;
                max-width: 400px;
                overflow: hidden;
            } 
            .one,
            .two, 
            .three{
                width: fit-content;
            }

        <div class="one">title one</div><br>
        <div class="two">title two with more words</div><br>
        <div class="three">title three with many many many words</div><br>
        <div class="four">title four with many many many many many many many many many many many many many many many many many many many many many many many many </div>
    </body>
</html>
