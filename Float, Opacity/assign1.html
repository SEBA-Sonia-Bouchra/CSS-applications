<!DOCTYPE html>
<html>
    <head>
        <style>
            .parent{
                width: 1000px;
                background-color: #ececec;
                text-align: center;
                font-family: Arial, Helvetica, sans-serif;
            }
            .fw div,
            .one-three div,
            .one-two div,
            .one-four div{
                float: left;
                padding-top: 10px;
                padding-bottom: 10px;
                margin-left: 15px;
                margin-top: 15px;
                background-color: rgb(222, 222, 222);
            }
            .fw div{
                width: calc((100% - 30px));
            }
            .one-three div{
                width: calc((100% - 60px) / 3);
            }
            .one-two div{
                width: calc((100% - 45px) / 2);
            }
            .one-four div{
                width: calc((100% - 75px) / 4);
                margin-bottom: 15px;
            }
            .clear{
                clear: left;
            }
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="fw">
                <div>Full Width</div>
                <p class="clear"></p>
            </div>
            <div class="one-three">
                <div>1/3</div>
                <div>1/3</div>
                <div>1/3</div>
                <p class="clear"></p>
            </div>
            <div class="one-two">
                <div>1/2</div>
                <div>1/2</div>
                <p class="clear"></p>
            </div>
            <div class="one-four">
                <div>1/4</div>
                <div>1/4</div>
                <div>1/4</div>
                <div>1/4</div>
                <p class="clear"></p>
            </div>
        </div>
    </body>
</html>
